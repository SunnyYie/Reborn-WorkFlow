name: Portable Regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  public-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install adapter dependencies without private data
        run: python -m pip install -r requirements-agent.txt
      - name: Adapter, process locking and real MCP transport
        run: python -B -m unittest discover -s tests_portable -p "test_*.py" -v
      - name: Original source-only song, key and spoken confirmation barriers
        working-directory: workflow
        run: python -B -m unittest test_workflow test_keys test_spoken -q
      - name: Repository policy
        run: python -B -m unittest discover -s scripts -p "test*.py" -q
