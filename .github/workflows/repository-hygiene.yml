name: Repository Hygiene

on: [push, pull_request]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test repository policy
        run: python3 -B -m unittest discover -s scripts -p 'test*.py' -v
      - name: Reject private artifacts in current tree and history
        run: |
          python3 scripts/check_repository.py --tree HEAD
          python3 scripts/check_repository.py --history
      - name: Scan credential patterns with Gitleaks
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --retry 2 --output "$archive" "$base/$archive"
          curl --fail --location --retry 2 --output checksums.txt "$base/gitleaks_${version}_checksums.txt"
          grep "  $archive\$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner --max-archive-depth 3 --max-decode-depth 3
